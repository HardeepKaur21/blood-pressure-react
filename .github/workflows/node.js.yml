name: CI pipeline

on:
  push:
    branches: ["main", "qa"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  #ci
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx vitest run --coverage
      - run: npm run lint
      - run: npm run build

  #qa
  deploy-qa:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    environment: qa

    outputs:
      url: ${{ steps.deploy.outputs.url }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - run: npm install --global vercel@65.17.0
      - run: vercel pull --yes --environment=preview --git-branch=qa
      - run: vercel build

      - name: Deploy to Vercel QA
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  #e2e tests
  e2e-tests:
    needs: deploy-qa
    runs-on: ubuntu-latest

    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.deploy-qa.outputs.url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  #performance
  performance-tests:
    needs: [deploy-qa, e2e-tests]
    runs-on: ubuntu-latest

    env:
      K6_BASE_URL: ${{ needs.deploy-qa.outputs.url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
      K6_CLOUD_STACK_ID: ${{ vars.K6_CLOUD_STACK_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 baseline test
        env:
          K6_SUMMARY_EXPORT: baseline-results.json
        run: |
          k6 cloud run --local-execution --no-archive-upload \
            -e K6_BASE_URL="$K6_BASE_URL" \
            -e VERCEL_AUTOMATION_BYPASS_SECRET="$VERCEL_AUTOMATION_BYPASS_SECRET" \
            performance/baseline.js

      - name: Run k6 load test
        env:
          K6_SUMMARY_EXPORT: load-results.json
        run: |
          k6 cloud run --local-execution --no-archive-upload \
            -e K6_BASE_URL="$K6_BASE_URL" \
            -e VERCEL_AUTOMATION_BYPASS_SECRET="$VERCEL_AUTOMATION_BYPASS_SECRET" \
            performance/load.js

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-results
          path: |
            baseline-results.json
            load-results.json
          if-no-files-found: warn

  #automated secutiry checks
  security-tests:
    needs: [deploy-qa, e2e-tests]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ZAP_AUTH_HEADER: x-vercel-protection-bypass
      ZAP_AUTH_HEADER_VALUE: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      ZAP_AUTH_HEADER_SITE: ${{ needs.deploy-qa.outputs.url }}

    steps:
      - uses: actions/checkout@v7

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ needs.deploy-qa.outputs.url }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-security-report

  #prod
  deploy-vercel:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - run: npm install --global vercel@65.17.0
      - run: vercel pull --yes --environment=production
      - run: vercel build --prod
      - run: vercel deploy --prebuilt --prod

  security-tests:
    needs: deploy-qa
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ZAP_AUTH_HEADER: x-vercel-protection-bypass
      ZAP_AUTH_HEADER_VALUE: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      ZAP_AUTH_HEADER_SITE: ${{ needs.deploy-qa.outputs.url }}

    steps:
      - uses: actions/checkout@v7

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ needs.deploy-qa.outputs.url }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-security-report
